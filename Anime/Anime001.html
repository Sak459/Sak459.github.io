<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantilla Movies</title>

<style>
:root{
  --bg:#000;
  --accent:#ff3c78;
  --card:#1a1a1a;
  --text:#fff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:5px;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  user-select:none;
}

img{
  -webkit-user-drag:none;
  user-drag:none;
}

.header-fixed{
  width:100%;
  max-width:1000px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.banner-top{
  width:100%;
  height:205px;
  object-fit:cover;
  border-radius:8px 8px 8px 8px;
}

.poster{
  width:150px;
  border-radius:16px;
  margin-top:-70px;
  z-index:5;
  position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.anime-info{
  width:95%;
  max-width:1000px;
  text-align:center;
  margin-top:10px;
}

#animeTitle{
  font-size:1.6rem;
  margin:8px 0;
}

.meta{
  color:#bbb;
  font-size:.9rem;
  margin-bottom:12px;
}

.synopsis{
  color:#ddd;
  font-size:.95rem;
  line-height:1.7;
  margin:15px auto 5px;
  max-width:900px;
  text-align:center;
  white-space:pre-wrap;
}

#toggleSynopsis{
  display:none;
  margin:8px auto 15px;
  color:var(--accent);
  font-weight:bold;
  cursor:pointer;
  text-align:center;
  user-select:none;
  font-size:.9rem;
}

#toggleSynopsis:hover{
  opacity:.8;
}

.series-actions{
  display:flex;
  gap:24px;
  margin:16px 0;
}

.action-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:95px;
  padding:10px;
  border-radius:14px;
  background:#111;
  cursor:pointer;
  font-size:.8rem;
  color:#bbb;
  transition:.2s;
}

.action-btn.active{
  background:var(--accent);
  color:#fff;
}

#episodeTitle{
  font-size:1rem;
  margin-bottom:10px;
}

.scroll-episodes{
  width:100%;
  max-width:1000px;
  flex-grow:1;
  overflow-y:auto;
  padding:8px;
  padding-bottom:20px;
}

.episode-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.episode{
  background:var(--card);
  border-radius:14px;
  min-height:50px;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  position:relative;
  overflow:hidden;
}

.episode::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.55);
}

.episode span{
  position:relative;
  z-index:2;
  padding:10px;
  text-align:center;
}

.episode.active,
.episode.last-watched{
  outline:2px solid var(--accent);
}

/* Modal */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:.4s;
}

.modal-overlay.active{
  opacity:1;
  pointer-events:all;
}

.modal{
  background:#1f1f1f;
  border-radius:16px;
  padding:35px 30px;
  max-width:400px;
  width:90%;
  text-align:center;
}

.modal h2{
  margin:0;
  color:#ff4d4d;
}

.modal p{
  color:#ccc;
}

.modal ul{
  text-align:left;
  color:#999;
}

.modal button{
  margin-top:20px;
  padding:12px 24px;
  background:#ff4d4d;
  border:none;
  border-radius:8px;
  color:#fff;
  opacity:.7;
}

/* Toast */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#28a745;
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
  font-size:16px;
  opacity:0;
  transition:.4s;
  z-index:10000;
}

.toast.show{
  opacity:1;
}

/* Loading Screen */

#loadingScreen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999999;
  transition:opacity .4s ease;
}

#loadingScreen.hide{
  opacity:0;
  pointer-events:none;
}

.spinner{
  width:70px;
  height:70px;
  border:4px solid rgba(255,255,255,.15);
  border-top:4px solid var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loading-text{
  margin-top:15px;
  color:#fff;
  font-size:1.5rem;
}

@keyframes spin{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">Cargando...</div>
</div>

<div class="header-fixed">

  <img class="banner-top" src="" id="banner">

  <img class="poster" id="poster">

  <div class="anime-info">

    <h1 id="animeTitle">Cargando...</h1>

    <div class="meta" id="animeMeta"></div>

    <p id="animeSynopsis" class="synopsis">
    Cargando sinopsis...
    </p>

    <div id="toggleSynopsis">
     Ver más
     </div>

  </div>

  <div class="series-actions">
    <div class="action-btn" id="favoriteBtn">❤️ Favoritos</div>
    <div class="action-btn" id="watchedBtn">✔ Finalizada</div>
  </div>

  <div id="episodeTitle">Selecciona un Episoddio</div>

</div>

<div class="scroll-episodes">
  <section class="episode-list" id="episodeList"></section>
</div>

<!-- Modal -->
<div class="modal-overlay" id="connectionModal">
  <div class="modal">
    <h2>Sin conexión</h2>
    <p>No se detecta acceso a Internet.</p>

    <ul>
      <li>Verifica tu Wi-Fi o datos móviles</li>
      <li>Conéctate a una red disponible</li>
      <li>Espera mientras se reconecta</li>
    </ul>

    <button disabled>Reconectando...</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  ✅ ¡Conexión restaurada!
</div>

<script>

/* ================= TMDB ================= */

const TMDB_API = "b6083b855479a79fd9acdb0a2789f126";

/* Anime */
const tmdbType = "tv";
const tmdbId = 209867;
/* Título personalizado */
const customTitle = "Sousou no Frieren";

/* Poster personalizado */
const customPoster = "https://image.tmdb.org/t/p/w500/dDRiOkCBCkd7w6ysMFr39G16opQ.jpg";

/* Backdrop personalizado */
const customBackdrop = "";

/* Sinopsis personalizada */
const customSynopsis = "";

/* Temporada de TMDB */
const seasonNumber = 1;

/* Episodios que quieres mostrar */
const firstEpisode = 1;
const lastEpisode = 28;

/* ID local */
const seriesId = "Anime001";

/* Tus links de video */
const videoLinks = [
'https://cdn.krilin.to/m3u8/b510e3389bdef7a567b7dc7ddc650ad2',
'https://cdn.krilin.to/m3u8/6eee61a9825a3c851065bbd321bb8f9e',
'https://cdn.krilin.to/m3u8/345554fa8b198db3bd2cf158f6367046',
'https://cdn.krilin.to/m3u8/bedc2c96b825760792980c3a28fdd5f3',
'https://cdn.krilin.to/m3u8/4f219b7553d2be7877410d3c5d4d1e20',
'https://cdn.krilin.to/m3u8/e47e04bdcb884eb21d911500d3e4067a',
'https://cdn.krilin.to/m3u8/25640065cbbc9acf40c1cb02b040fbf9',
'https://cdn.krilin.to/m3u8/92ec8ec057cb6a2f8c5ef8716e978059',
'https://cdn.krilin.to/m3u8/837c8e99e9482cc02b358f69ed6401d9',
'https://cdn.krilin.to/m3u8/231f6ee227da996c6913e071980bd1a4',
'https://cdn.krilin.to/m3u8/5dff04e7c29f256ae7add8aeeac6cf8d',
'https://cdn.krilin.to/m3u8/56079a1348c91354a0c89e2ac1f7ed33',
'https://cdn.krilin.to/m3u8/b98f09aafed66440e42cc8875c630264',
'https://cdn.krilin.to/m3u8/73fa77ff19d5d2cdc7c87036b8b82b2f',
'https://cdn.krilin.to/m3u8/3b22710ae158665fc02186b9733259eb',
'https://cdn.krilin.to/m3u8/4104057ff3d3e299edfd57574f6357d7',
'https://cdn.krilin.to/m3u8/8b28e17ceaf7394d3083575ed8203d40',
'https://cdn.krilin.to/m3u8/87a716aeff15104559c4566d58166a6c',
'https://cdn.krilin.to/m3u8/575705c8839328ad47466473303bcaab',
'https://cdn.krilin.to/m3u8/0a3f1dd84132ebed5a9a7068d9f6a20c',
'https://cdn.krilin.to/m3u8/857584ad704b0467ab278b9247bc7f03',
'https://cdn.krilin.to/m3u8/626aabaf47f82f32e1aca39a67fab7ae',
'https://cdn.krilin.to/m3u8/c229e828831cecb33b8ea7883ac42238',
'https://cdn.krilin.to/m3u8/6bec812597e5dfe7c09854dd866d8eda',
'https://cdn.krilin.to/m3u8/169dd1be30e37524aefbace1d317c596',
'https://cdn.krilin.to/m3u8/fc68e63ab846af39a60513fc43d7ca75',
'https://cdn.krilin.to/m3u8/25580c2adf0dd34dc9728168bd2c7376',
'https://cdn.krilin.to/m3u8/ca3af2ff744cc6d12e291ce09f1c0f17',
'https://cdn.krilin.to/m3u8/5b6e85ce995fa48d39e07a946b965dd0',
'https://cdn.krilin.to/m3u8/1de12c83f75d3910324ff5fcf17b0c77',
'https://cdn.krilin.to/m3u8/2e5dc9b0055881651e79a561aec4734e',
'https://cdn.krilin.to/m3u8/5a00943c928e4e33a3484978018fa93a',
'https://cdn.krilin.to/m3u8/b8f15aaf9c39b03f1534dbb5b15d4f51',
'https://cdn.krilin.to/m3u8/638112d21364dad6f01cf98cb58af81c',
'https://cdn.krilin.to/m3u8/26ad932b487fc750f3226c4a8a3d7603',
'https://cdn.krilin.to/m3u8/d7464bbe2dccb4e8bd7aaee533aaf9de',
'https://cdn.krilin.to/m3u8/2118cdd38966f33678f69550c996ad7c',
'https://cdn.krilin.to/m3u8/46472ce0f3474385a18960150f6b1ce8',
];

/* ================= ELEMENTOS ================= */

const episodeList = document.getElementById('episodeList');
const episodeTitle = document.getElementById('episodeTitle');

const favBtn = document.getElementById('favoriteBtn');
const watchedBtn = document.getElementById('watchedBtn');
const currentPage = window.location.pathname;

const synopsis = document.getElementById("animeSynopsis");
const toggleSynopsis = document.getElementById("toggleSynopsis");

let fullSynopsis = "";
let synopsisExpanded = false;

  const loadingScreen =
  document.getElementById("loadingScreen");

function hideLoading(){

  if(!loadingScreen) return;

  loadingScreen.classList.add("hide");

  setTimeout(()=>{
    loadingScreen?.remove();
  },400);

}

let episodes = [];
let currentEpisode = localStorage.getItem(seriesId+'_lastEpisode');

currentEpisode = currentEpisode !== null
  ? parseInt(currentEpisode)
  : null;

/* ================= STORAGE ================= */

const getList = k =>
  JSON.parse(localStorage.getItem(k)) || [];

const saveList = (k,v) =>
  localStorage.setItem(k, JSON.stringify(v));

/* ================= FAVORITOS ================= */

function isFavorite(){
  return getList('favorites').some(s => s.id === seriesId);
}

function toggleFavorite(){

  let favs = getList('favorites');

  if(isFavorite()){

    favs = favs.filter(s => s.id !== seriesId);

    favBtn.classList.remove('active');

  }else{

    favs.push({
     id: seriesId,
     title:         document.getElementById("animeTitle").textContent,
     banner: document.getElementById("poster").src,
     page: currentPage
    });

    favBtn.classList.add('active');

  }

  saveList('favorites', favs);

}

/* ================= FINALIZADA ================= */

function toggleWatched(){

  let list = getList('watched');

  if(list.includes(seriesId)){

    list = list.filter(id => id !== seriesId);

    watchedBtn.classList.remove('active');

  }else{

    list.push(seriesId);

    watchedBtn.classList.add('active');

  }

  saveList('watched', list);

}

/* ================= CARGAR ANIME ================= */

async function loadAnime(){

  try{

    /* Obtener datos */

    const detailsReq = await fetch(
      `https://api.themoviedb.org/3/${tmdbType}/${tmdbId}?api_key=${TMDB_API}&language=es-ES`
    );

    const data = await detailsReq.json();

    /* Banner */
    document.getElementById("banner").src =
  customBackdrop ||
  `https://image.tmdb.org/t/p/original${data.backdrop_path}`;

    /* Poster */
    document.getElementById("poster").src =
  customPoster || `https://image.tmdb.org/t/p/w500${data.poster_path}`;

    /* Título personalizado */
document.getElementById("animeTitle").textContent =
  customTitle || data.name || data.title;

  /* Sinopsis */
fullSynopsis =
  customSynopsis && customSynopsis.trim() !== ""
    ? customSynopsis
    : (
        data.overview && data.overview.trim() !== ""
          ? data.overview
          : "No hay sinopsis disponible."
      );

if(fullSynopsis.length > 150){

    synopsis.textContent =
        fullSynopsis.substring(0,150) + "...";

    toggleSynopsis.style.display = "block";
    toggleSynopsis.textContent = "Ver más";

    synopsisExpanded = false;

}else{

    synopsis.textContent = fullSynopsis;

    toggleSynopsis.style.display = "none";

}

    /* Géneros */
    const genres = data.genres
  .map(g => g.name)
  .join(", ");

    /* ================= SERIES ================= */

    if(tmdbType === "tv"){

      const seasonReq = await fetch(
        `https://api.themoviedb.org/3/tv/${tmdbId}/season/${seasonNumber}?api_key=${TMDB_API}&language=es-ES`
      );

      const seasonData = await seasonReq.json();

      const seasonYear =
  seasonData.air_date
    ? seasonData.air_date.split("-")[0]
    : "";

const displayedEpisodes =
  Math.min(
    seasonData.episodes.length,
    lastEpisode
  ) - firstEpisode + 1;

document.getElementById("animeMeta").innerHTML =
`
⭐ ${data.vote_average.toFixed(1)}
• ${seasonYear}
• ${genres}
• ${displayedEpisodes} Episodios
`;

/* ================= EPISODIOS TEMPORADA ================= */

const episodiosDisponibles = [];

for(let numero = firstEpisode; numero <= lastEpisode; numero++){

  const ep = seasonData.episodes.find(
    e => e.episode_number === numero
  );

  if(!ep){
    continue;
  }


  const videoIndex = numero - 1;

  if(
    !ep.air_date ||
    new Date(ep.air_date) > new Date()
  ){
    continue;
  }

  if(!videoLinks[videoIndex]){
    console.log(
      "❌ No existe video para episodio:",
      numero,
      "índice:",
      videoIndex
    );

    continue;
  }

  console.log(
    "🎬 Episodio:",
    numero,
    "→ videoLinks[" + videoIndex + "]"
  );

  episodiosDisponibles.push({

    title: `Episodio ${numero - firstEpisode + 1}`,

    tmdbEpisode: numero,

    url: videoLinks[videoIndex],

    thumbnail:
      ep.still_path
        ? `https://image.tmdb.org/t/p/w500${ep.still_path}`
        : `https://image.tmdb.org/t/p/original${data.backdrop_path}`

  });

}

episodes = episodiosDisponibles;

    }

    /* ================= PELÍCULAS ================= */

    else{

  const year =
    (data.release_date || "")
      .split("-")[0];

  document.getElementById("animeMeta").innerHTML =
  `
  ⭐ ${data.vote_average.toFixed(1)}
  • ${year}
  • ${genres}
  • ${data.runtime} Min
  `;

  episodes = [{

    title: "VER PELICULA",

    url: videoLinks[0] || '',

    thumbnail:
      `https://image.tmdb.org/t/p/original${data.backdrop_path}`

}];

}

    renderEpisodes();

    hideLoading();

  }catch(err){

    console.log(err);

    hideLoading();

    showToast("❌ Error cargando TMDb", "#ff4444");

  }

}

/* ================= RENDER ================= */

function renderEpisodes(){

  episodeList.innerHTML = '';

  episodes.forEach((ep,i)=>{

    const div = document.createElement('div');

    div.className='episode';

    div.style.backgroundImage=`url(${ep.thumbnail})`;

    div.innerHTML=`<span>${ep.title}</span>`;

    div.onclick=()=>loadEpisode(i);

    episodeList.appendChild(div);

  });

  updateUI();

  /* Scroll automático al último episodio visto */

  if(currentEpisode !== null && episodes[currentEpisode]){

    episodeTitle.textContent =
      episodes[currentEpisode].title;

    setTimeout(()=>{

      document.querySelectorAll('.episode')[currentEpisode]
        ?.scrollIntoView({
          behavior:'smooth',
          block:'center'
        });

    },1500);

  }

}

/* ================= REPRODUCIR ================= */

function loadEpisode(i){

  const episodio = episodes[i];

  if(!episodio){
    showToast(
      "❌ Episodio no disponible",
      "#ff4444"
    );
    return;
  }

  currentEpisode = i;

  episodeTitle.textContent = episodio.title;

  const url = episodio.url;

  console.log("================================");
  console.log("▶ EPISODIO SELECCIONADO");
  console.log("Episodio mostrado:", episodio.title);
  console.log("Episodio global TMDB:", episodio.tmdbEpisode);
  console.log("Índice local:", i);
  console.log("URL:", url);
  console.log("================================");

  if(url){

    Android.openEpisode(String(url));

  }else{

    showToast(
      "❌ Episodio no disponible",
      "#ff4444"
    );

    return;
  }

  localStorage.setItem(
    seriesId + '_lastEpisode',
    String(i)
  );

  updateUI();
}

/* ================= UI ================= */

function updateUI(){

  document.querySelectorAll('.episode')
    .forEach((e,idx)=>{

      e.classList.toggle(
        'active',
        idx===currentEpisode
      );

      e.classList.toggle(
        'last-watched',
        idx===currentEpisode
      );

    });

}

/* ================= INIT ================= */

if(isFavorite())
  favBtn.classList.add('active');

if(getList('watched').includes(seriesId))
  watchedBtn.classList.add('active');

favBtn.onclick = toggleFavorite;

watchedBtn.onclick = toggleWatched;

/* Ver más / Ver menos de la sinopsis */

toggleSynopsis.onclick = ()=>{

    synopsisExpanded = !synopsisExpanded;

    if(synopsisExpanded){

        synopsis.textContent = fullSynopsis;
        toggleSynopsis.textContent = "Ver menos";

    }else{

        synopsis.textContent =
            fullSynopsis.substring(0,150) + "...";

        toggleSynopsis.textContent = "Ver más";

    }

};

loadAnime();

/* ================= CONEXIÓN ================= */

const modal = document.getElementById("connectionModal");

let wasOffline = false;

function updateConnectionStatus(){

  if(!navigator.onLine){

    modal.classList.add("active");

    wasOffline = true;

  }else{

    modal.classList.remove("active");

    if(wasOffline){

      showToast("✅ ¡Conexión restaurada!");

      wasOffline = false;

    }

  }

}

window.addEventListener(
  "load",
  updateConnectionStatus
);

window.addEventListener(
  "offline",
  updateConnectionStatus
);

window.addEventListener(
  "online",
  updateConnectionStatus
);

/* ================= TOAST ================= */

function showToast(message, color="#28a745"){

  const toast = document.getElementById("toast");

  toast.style.background = color;

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(()=>{

    toast.classList.remove("show");

  },3500);

}

/* ================= BLOQUEOS ================= */

document.addEventListener(
  "dragstart",
  e => e.preventDefault()
);

document.addEventListener(
  "selectstart",
  e => e.preventDefault()
);

</script>

</body>
</html>
