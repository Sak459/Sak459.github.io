<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantilla Movies</title>

<style>
:root{
  --bg:#000;
  --accent:#ff3c78;
  --card:#1a1a1a;
  --text:#fff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:5px;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  user-select:none;
}

img{
  -webkit-user-drag:none;
  user-drag:none;
}

.header-fixed{
  width:100%;
  max-width:1000px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.banner-top{
  width:100%;
  height:205px;
  object-fit:cover;
  border-radius:8px 8px 8px 8px;
}

.poster{
  width:150px;
  border-radius:16px;
  margin-top:-70px;
  z-index:5;
  position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.anime-info{
  width:95%;
  max-width:1000px;
  text-align:center;
  margin-top:10px;
}

#animeTitle{
  font-size:1.6rem;
  margin:8px 0;
}

.meta{
  color:#bbb;
  font-size:.9rem;
  margin-bottom:12px;
}

.synopsis{
  color:#ddd;
  font-size:.95rem;
  line-height:1.7;
  margin:15px auto 5px;
  max-width:900px;
  text-align:center;
  white-space:pre-wrap;
}

#toggleSynopsis{
  display:none;
  margin:8px auto 15px;
  color:var(--accent);
  font-weight:bold;
  cursor:pointer;
  text-align:center;
  user-select:none;
  font-size:.9rem;
}

#toggleSynopsis:hover{
  opacity:.8;
}

.series-actions{
  display:flex;
  gap:24px;
  margin:16px 0;
}

.action-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:95px;
  padding:10px;
  border-radius:14px;
  background:#111;
  cursor:pointer;
  font-size:.8rem;
  color:#bbb;
  transition:.2s;
}

.action-btn.active{
  background:var(--accent);
  color:#fff;
}

#episodeTitle{
  font-size:1rem;
  margin-bottom:10px;
}

.scroll-episodes{
  width:100%;
  max-width:1000px;
  flex-grow:1;
  overflow-y:auto;
  padding:8px;
  padding-bottom:20px;
}

.episode-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.episode{
  background:var(--card);
  border-radius:14px;
  min-height:50px;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  position:relative;
  overflow:hidden;
}

.episode::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.55);
}

.episode span{
  position:relative;
  z-index:2;
  padding:10px;
  text-align:center;
}

.episode.active,
.episode.last-watched{
  outline:2px solid var(--accent);
}

/* Modal */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:.4s;
}

.modal-overlay.active{
  opacity:1;
  pointer-events:all;
}

.modal{
  background:#1f1f1f;
  border-radius:16px;
  padding:35px 30px;
  max-width:400px;
  width:90%;
  text-align:center;
}

.modal h2{
  margin:0;
  color:#ff4d4d;
}

.modal p{
  color:#ccc;
}

.modal ul{
  text-align:left;
  color:#999;
}

.modal button{
  margin-top:20px;
  padding:12px 24px;
  background:#ff4d4d;
  border:none;
  border-radius:8px;
  color:#fff;
  opacity:.7;
}

/* Toast */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#28a745;
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
  font-size:16px;
  opacity:0;
  transition:.4s;
  z-index:10000;
}

.toast.show{
  opacity:1;
}

/* Loading Screen */

#loadingScreen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999999;
  transition:opacity .4s ease;
}

#loadingScreen.hide{
  opacity:0;
  pointer-events:none;
}

.spinner{
  width:70px;
  height:70px;
  border:4px solid rgba(255,255,255,.15);
  border-top:4px solid var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loading-text{
  margin-top:15px;
  color:#fff;
  font-size:1.5rem;
}

@keyframes spin{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">Cargando...</div>
</div>

<div class="header-fixed">

  <img class="banner-top" src="" id="banner">

  <img class="poster" id="poster">

  <div class="anime-info">

    <h1 id="animeTitle">Cargando...</h1>

    <div class="meta" id="animeMeta"></div>

    <p id="animeSynopsis" class="synopsis">
    Cargando sinopsis...
    </p>

    <div id="toggleSynopsis">
     Ver más
     </div>

  </div>

  <div class="series-actions">
    <div class="action-btn" id="favoriteBtn">❤️ Favoritos</div>
    <div class="action-btn" id="watchedBtn">✔ Finalizada</div>
  </div>

  <div id="episodeTitle">Selecciona un Episoddio</div>

</div>

<div class="scroll-episodes">
  <section class="episode-list" id="episodeList"></section>
</div>

<!-- Modal -->
<div class="modal-overlay" id="connectionModal">
  <div class="modal">
    <h2>Sin conexión</h2>
    <p>No se detecta acceso a Internet.</p>

    <ul>
      <li>Verifica tu Wi-Fi o datos móviles</li>
      <li>Conéctate a una red disponible</li>
      <li>Espera mientras se reconecta</li>
    </ul>

    <button disabled>Reconectando...</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  ✅ ¡Conexión restaurada!
</div>

<script>

/* ================= TMDB ================= */

const TMDB_API = "b6083b855479a79fd9acdb0a2789f126";

/* Anime */
const tmdbType = "tv";
const tmdbId = 30984;
/* Título personalizado */
const customTitle = "Bleach: Sennen Kessen-hen - Soukoku-tan";

/* Poster personalizado */
const customPoster = "https://image.tmdb.org/t/p/w500/mtbY8EkmzQECgozxBIhIgkjCy3Q.jpg";

/* Backdrop personalizado */
const customBackdrop = "";

/* Sinopsis personalizada */
const customSynopsis = "";

/* Temporada de TMDB */
const seasonNumber = 2;

/* Episodios que quieres mostrar */
const firstEpisode = 27;
const lastEpisode = 40;

/* ID local */
const seriesId = "Anime012";

/* Tus links de video */
const videoLinks = [
'https://cdn.krilin.to/m3u8/828ffba5bb7af9de64509e3583360ac7',
'https://cdn.krilin.to/m3u8/8fecd0ba60d3e0524fafd92e56a681bf',
'https://cdn.krilin.to/m3u8/1a23543ed4eca26abffa6ebd0f1b2859',
'https://cdn.krilin.to/m3u8/80bba603544d011e8fe354a4104fbfee',
'https://cdn.krilin.to/m3u8/a6f0e101b2f1ac0d7987cec7aa303253',
'https://cdn.krilin.to/m3u8/cb275638015f6c0ff73a1a19ad5f2cb8',
'https://cdn.krilin.to/m3u8/3c7566208588b5c075157fb18257e6ff',
'https://cdn.krilin.to/m3u8/cef3a5b855d8bae4c803a69c45d0f92f',
'https://cdn.krilin.to/m3u8/1de44b3a965fea2bdce565d54e186295',
'https://cdn.krilin.to/m3u8/8ef71dcfcff3a4f8ad79b7846bd91e55',
'https://cdn.krilin.to/m3u8/f050f2895678f23e5610170013366b1c',
'https://cdn.krilin.to/m3u8/bc6337f5dffdee69258961926b50310e',
'https://cdn.krilin.to/m3u8/483ddf0d9c4c12aa0c5a400e5537e7c2',
'https://cdn.krilin.to/m3u8/5e6615c7e42b310613bcc0ff6d8b45e9',
'https://cdn.krilin.to/m3u8/0b64e8b92fd41179d4dee5ae94cd9ca6',
'https://cdn.krilin.to/m3u8/ba3f1db8a8a623424383320a7b85d6d2',
'https://cdn.krilin.to/m3u8/a3dcb249cfbdf07771136942d16b1fd1',
'https://cdn.krilin.to/m3u8/3730062a11b7367621a181984d6235a0',
'https://cdn.krilin.to/m3u8/f898c854072089597337ca00e0a4a7ad',
'https://cdn.krilin.to/m3u8/dc6bc3ae748374b3cab61b17c7c5ee7c',
'https://cdn.krilin.to/m3u8/b220f64bae0e796f4b69c8f74b7811fc',
'https://cdn.krilin.to/m3u8/c79ebe2b71258e3c696d9afde8ac6245',
'https://cdn.krilin.to/m3u8/ca43b2324b7a7aa32889443893142da0',
'https://cdn.krilin.to/m3u8/5af2959c235f6fda0dad81a18913dd8e',
'https://cdn.krilin.to/m3u8/cdea9ca34a21ea621723d74c4a67fde0',
'https://cdn.krilin.to/m3u8/714c9cbe043e6e645841924e175480a7',
'https://cdn.krilin.to/m3u8/e890f2679c1f7fb869e4e120d61c8d0b',
'https://cdn.krilin.to/m3u8/da49b3ba163b0832bbee38adf17fb88e',
'https://cdn.krilin.to/m3u8/5dc31e193bf4401ce5a849fff3903444',
'https://cdn.krilin.to/m3u8/1e19df5265ab324e13496d8f6dec8876',
'https://cdn.krilin.to/m3u8/b4f32ee8414423e53e02bafa8c406782',
'https://cdn.krilin.to/m3u8/532765d60f2df45e59b5f647e3a85708',
'https://cdn.krilin.to/m3u8/55a79398acdd73ffe44c8023c89f9d86',
'https://cdn.krilin.to/m3u8/72a65a50664dfb71fb9144f4fbdc128e',
'https://cdn.krilin.to/m3u8/7e9793a74823e5291638aeafe152f0f4',
'https://cdn.krilin.to/m3u8/9a3844aec45a3c719176e5d102aa6899',
'https://cdn.krilin.to/m3u8/2fbc9b79ef8c977b0093c322708269e4',
'https://cdn.krilin.to/m3u8/747359288080617e83ba7994072f21a8',
'https://cdn.krilin.to/m3u8/a8d60f912d4ffe1c3fea7f110271faed',
'https://cdn.krilin.to/m3u8/c603da8ca13e1f2b8cbe54ec56bd6a2d',
'https://cdn.krilin.to/m3u8/6a71c5a6e6fe622dc1ad7e764ccc41ed',
'https://cdn.krilin.to/m3u8/15b1cc22e4085bd383eabc8ed614440b',
'https://cdn.krilin.to/m3u8/a86d1fbd104a2c7eb9a4837406f521d4',
'https://cdn.krilin.to/m3u8/202b45e8d3603e3eb6dfef12b3cf5471',
'https://cdn.krilin.to/m3u8/1f69cd285089d56196718a05589b1644',
'https://cdn.krilin.to/m3u8/ce4b77b32d12ff0e3dd9f3c3adc3eb6a',
'https://cdn.krilin.to/m3u8/5154e00db0e9d82d2cb50802e85e4c54'
];

/* ================= ELEMENTOS ================= */

const episodeList = document.getElementById('episodeList');
const episodeTitle = document.getElementById('episodeTitle');

const favBtn = document.getElementById('favoriteBtn');
const watchedBtn = document.getElementById('watchedBtn');
const currentPage = window.location.pathname;

const synopsis = document.getElementById("animeSynopsis");
const toggleSynopsis = document.getElementById("toggleSynopsis");

let fullSynopsis = "";
let synopsisExpanded = false;

  const loadingScreen =
  document.getElementById("loadingScreen");

function hideLoading(){

  if(!loadingScreen) return;

  loadingScreen.classList.add("hide");

  setTimeout(()=>{
    loadingScreen?.remove();
  },400);

}

let episodes = [];
let currentEpisode = localStorage.getItem(seriesId+'_lastEpisode');

currentEpisode = currentEpisode !== null
  ? parseInt(currentEpisode)
  : null;

/* ================= STORAGE ================= */

const getList = k =>
  JSON.parse(localStorage.getItem(k)) || [];

const saveList = (k,v) =>
  localStorage.setItem(k, JSON.stringify(v));

/* ================= FAVORITOS ================= */

function isFavorite(){
  return getList('favorites').some(s => s.id === seriesId);
}

function toggleFavorite(){

  let favs = getList('favorites');

  if(isFavorite()){

    favs = favs.filter(s => s.id !== seriesId);

    favBtn.classList.remove('active');

  }else{

    favs.push({
     id: seriesId,
     title:         document.getElementById("animeTitle").textContent,
     banner: document.getElementById("poster").src,
     page: currentPage
    });

    favBtn.classList.add('active');

  }

  saveList('favorites', favs);

}

/* ================= FINALIZADA ================= */

function toggleWatched(){

  let list = getList('watched');

  if(list.includes(seriesId)){

    list = list.filter(id => id !== seriesId);

    watchedBtn.classList.remove('active');

  }else{

    list.push(seriesId);

    watchedBtn.classList.add('active');

  }

  saveList('watched', list);

}

/* ================= CARGAR ANIME ================= */

async function loadAnime(){

  try{

    /* Obtener datos */

    const detailsReq = await fetch(
      `https://api.themoviedb.org/3/${tmdbType}/${tmdbId}?api_key=${TMDB_API}&language=es-ES`
    );

    const data = await detailsReq.json();

    /* Banner */
    document.getElementById("banner").src =
  customBackdrop ||
  `https://image.tmdb.org/t/p/original${data.backdrop_path}`;

    /* Poster */
    document.getElementById("poster").src =
  customPoster || `https://image.tmdb.org/t/p/w500${data.poster_path}`;

    /* Título personalizado */
document.getElementById("animeTitle").textContent =
  customTitle || data.name || data.title;

  /* Sinopsis */
fullSynopsis =
  customSynopsis && customSynopsis.trim() !== ""
    ? customSynopsis
    : (
        data.overview && data.overview.trim() !== ""
          ? data.overview
          : "No hay sinopsis disponible."
      );

if(fullSynopsis.length > 150){

    synopsis.textContent =
        fullSynopsis.substring(0,150) + "...";

    toggleSynopsis.style.display = "block";
    toggleSynopsis.textContent = "Ver más";

    synopsisExpanded = false;

}else{

    synopsis.textContent = fullSynopsis;

    toggleSynopsis.style.display = "none";

}

    /* Géneros */
    const genres = data.genres
  .map(g => g.name)
  .join(", ");

    /* ================= SERIES ================= */

    if(tmdbType === "tv"){

      const seasonReq = await fetch(
        `https://api.themoviedb.org/3/tv/${tmdbId}/season/${seasonNumber}?api_key=${TMDB_API}&language=es-ES`
      );

      const seasonData = await seasonReq.json();

      const seasonYear =
  seasonData.air_date
    ? seasonData.air_date.split("-")[0]
    : "";

const displayedEpisodes =
  Math.min(
    seasonData.episodes.length,
    lastEpisode
  ) - firstEpisode + 1;

document.getElementById("animeMeta").innerHTML =
`
⭐ ${data.vote_average.toFixed(1)}
• ${seasonYear}
• ${genres}
• ${displayedEpisodes} Episodios
`;

/* ================= EPISODIOS TEMPORADA ================= */

const episodiosDisponibles = [];

for(let numero = firstEpisode; numero <= lastEpisode; numero++){

  const ep = seasonData.episodes.find(
    e => e.episode_number === numero
  );

  if(!ep){
    continue;
  }


  const videoIndex = numero - 1;

  if(
    !ep.air_date ||
    new Date(ep.air_date) > new Date()
  ){
    continue;
  }

  if(!videoLinks[videoIndex]){
    console.log(
      "❌ No existe video para episodio:",
      numero,
      "índice:",
      videoIndex
    );

    continue;
  }

  console.log(
    "🎬 Episodio:",
    numero,
    "→ videoLinks[" + videoIndex + "]"
  );

  episodiosDisponibles.push({

    title: `Episodio ${numero - firstEpisode + 1}`,

    tmdbEpisode: numero,

    url: videoLinks[videoIndex],

    thumbnail:
      ep.still_path
        ? `https://image.tmdb.org/t/p/w500${ep.still_path}`
        : `https://image.tmdb.org/t/p/original${data.backdrop_path}`

  });

}

episodes = episodiosDisponibles;

    }

    /* ================= PELÍCULAS ================= */

    else{

  const year =
    (data.release_date || "")
      .split("-")[0];

  document.getElementById("animeMeta").innerHTML =
  `
  ⭐ ${data.vote_average.toFixed(1)}
  • ${year}
  • ${genres}
  • ${data.runtime} Min
  `;

  episodes = [{

    title: "VER PELICULA",

    url: videoLinks[0] || '',

    thumbnail:
      `https://image.tmdb.org/t/p/original${data.backdrop_path}`

}];

}

    renderEpisodes();

    hideLoading();

  }catch(err){

    console.log(err);

    hideLoading();

    showToast("❌ Error cargando TMDb", "#ff4444");

  }

}

/* ================= RENDER ================= */

function renderEpisodes(){

  episodeList.innerHTML = '';

  episodes.forEach((ep,i)=>{

    const div = document.createElement('div');

    div.className='episode';

    div.style.backgroundImage=`url(${ep.thumbnail})`;

    div.innerHTML=`<span>${ep.title}</span>`;

    div.onclick=()=>loadEpisode(i);

    episodeList.appendChild(div);

  });

  updateUI();

  /* Scroll automático al último episodio visto */

  if(currentEpisode !== null && episodes[currentEpisode]){

    episodeTitle.textContent =
      episodes[currentEpisode].title;

    setTimeout(()=>{

      document.querySelectorAll('.episode')[currentEpisode]
        ?.scrollIntoView({
          behavior:'smooth',
          block:'center'
        });

    },1500);

  }

}

/* ================= REPRODUCIR ================= */

function loadEpisode(i){

  const episodio = episodes[i];

  if(!episodio){
    showToast(
      "❌ Episodio no disponible",
      "#ff4444"
    );
    return;
  }

  currentEpisode = i;

  episodeTitle.textContent = episodio.title;

  const url = episodio.url;

  console.log("================================");
  console.log("▶ EPISODIO SELECCIONADO");
  console.log("Episodio mostrado:", episodio.title);
  console.log("Episodio global TMDB:", episodio.tmdbEpisode);
  console.log("Índice local:", i);
  console.log("URL:", url);
  console.log("================================");

  if(url){

    Android.openEpisode(String(url));

  }else{

    showToast(
      "❌ Episodio no disponible",
      "#ff4444"
    );

    return;
  }

  localStorage.setItem(
    seriesId + '_lastEpisode',
    String(i)
  );

  updateUI();
}

/* ================= UI ================= */

function updateUI(){

  document.querySelectorAll('.episode')
    .forEach((e,idx)=>{

      e.classList.toggle(
        'active',
        idx===currentEpisode
      );

      e.classList.toggle(
        'last-watched',
        idx===currentEpisode
      );

    });

}

/* ================= INIT ================= */

if(isFavorite())
  favBtn.classList.add('active');

if(getList('watched').includes(seriesId))
  watchedBtn.classList.add('active');

favBtn.onclick = toggleFavorite;

watchedBtn.onclick = toggleWatched;

/* Ver más / Ver menos de la sinopsis */

toggleSynopsis.onclick = ()=>{

    synopsisExpanded = !synopsisExpanded;

    if(synopsisExpanded){

        synopsis.textContent = fullSynopsis;
        toggleSynopsis.textContent = "Ver menos";

    }else{

        synopsis.textContent =
            fullSynopsis.substring(0,150) + "...";

        toggleSynopsis.textContent = "Ver más";

    }

};

loadAnime();

/* ================= CONEXIÓN ================= */

const modal = document.getElementById("connectionModal");

let wasOffline = false;

function updateConnectionStatus(){

  if(!navigator.onLine){

    modal.classList.add("active");

    wasOffline = true;

  }else{

    modal.classList.remove("active");

    if(wasOffline){

      showToast("✅ ¡Conexión restaurada!");

      wasOffline = false;

    }

  }

}

window.addEventListener(
  "load",
  updateConnectionStatus
);

window.addEventListener(
  "offline",
  updateConnectionStatus
);

window.addEventListener(
  "online",
  updateConnectionStatus
);

/* ================= TOAST ================= */

function showToast(message, color="#28a745"){

  const toast = document.getElementById("toast");

  toast.style.background = color;

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(()=>{

    toast.classList.remove("show");

  },3500);

}

/* ================= BLOQUEOS ================= */

document.addEventListener(
  "dragstart",
  e => e.preventDefault()
);

document.addEventListener(
  "selectstart",
  e => e.preventDefault()
);

</script>

</body>
</html>
