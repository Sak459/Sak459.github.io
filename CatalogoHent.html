  <title>Seccion Ver Mas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #ddd;
      min-height: 100vh;
    }

    header {
      background-color: #000000;
      color: #fff;
      text-align: center;
      padding: 1.5rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 500;
    }

    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 5px;
      padding: 10px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .serie {
      background-color: var(--card-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .poster a {
      display: block;
      width: 100%;
      height: 185px;
      overflow: hidden;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .poster img:hover {
      transform: scale(1.04);
    }

    .titulo-serie {
      padding: 5px;
      text-align: center;
      background-color: #000000;
      color: #ffffff;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background-color: rgba(0, 0, 0, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: #1f1f1f;
  border-radius: 16px;
  padding: 35px 30px;
  max-width: 400px;
  width: 90%;
  text-align: center;
  box-shadow: 0 0 25px rgba(0,0,0,0.5);
  transform: translateY(30px);
  opacity: 0;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

.modal-overlay.active .modal {
  transform: translateY(0);
  opacity: 1;
}

.modal h2 {
  margin: 0;
  color: #ff4d4d;
  font-size: 22px;
}

.modal p {
  font-size: 16px;
  margin: 15px 0;
  color: #ccc;
}

.modal ul {
  text-align: left;
  margin: 10px 0 0 0;
  padding-left: 20px;
  color: #999;
  font-size: 14px;
}

.modal button {
  margin-top: 20px;
  padding: 12px 24px;
  background-color: #ff4d4d;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: not-allowed;
  opacity: 0.6;
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #28a745;
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 10000;
}
go:236994L
.toast.show {
  opacity: 1;
  pointer-events: auto;
}

/* Quita resaltado azul y menú táctil */
* {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

/* Bloqueo de selección y arrastre */
  body {
    -webkit-user-select: none; /* Safari */
    -moz-user-select: none;    /* Firefox */
    -ms-user-select: none;     /* IE10+/Edge */
    user-select: none;         /* Estándar */
  }

  img {
    -webkit-user-drag: none; /* Safari */
    user-drag: none;         /* Estándar */
    pointer-events: none;    /* Opcional: evita interacción con arrastrar imágenes */
  }
      /* Media Queries para pantallas más pequeñas */
    @media (max-width: 788px) {
      .catalogo {
        grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      }

      header h1 {
        font-size: 1.5rem;
      }

      .buscador input {
        width: 90%;
      }

      .titulo-serie {
        font-size: 0.5rem;
      }
    }

    @media (max-width: 400px) {
      .catalogo {
        grid-template-columns: 1fr; /* Una sola columna en móviles */
      }
    }
    
    .loading{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    transition:.3s;
}

.loading.hide{
    opacity:0;
    visibility:hidden;
}

.spinner{
    width:80px;
    height:80px;
    border:4px solid rgba(255,255,255,.2);
    border-top:4px solid #ff375e;
    border-radius:50%;
    animation:giro 1s linear infinite;
}

@keyframes giro{
    to{
        transform:rotate(360deg);
    }
}

<script>

const loading = document.getElementById("loading");

const API_KEY = "b6083b855479a79fd9acdb0a2789f126";
const TMDB = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";


/* =====================================================
   CONFIGURACIÓN
===================================================== */

/*
   Cantidad de portadas que se cargarán inmediatamente.
   
   Las siguientes utilizarán Lazy Loading.
*/
const PORTADAS_INICIALES = 20;


/*
   Tiempo de duración de la caché.

   30 días.
*/
const CACHE_DURATION =
    30 * 24 * 60 * 60 * 1000;


/*
   Versión de la caché.

   Si algún día cambias la estructura de los datos,
   puedes cambiar v1 por v2 y se creará una caché nueva.
*/
const CACHE_VERSION = "v1";

const CACHE_KEY =
    "rakuen_ver_mas_tmdb_" + CACHE_VERSION;


/* =====================================================
   LOADER
===================================================== */

function hideLoading(){

    loading.classList.add("hide");

}


/* =====================================================
   OBTENER CACHÉ
===================================================== */

function obtenerCache(){

    try{

        return JSON.parse(
            localStorage.getItem(CACHE_KEY)
        ) || {};

    }catch(error){

        console.log(
            "❌ Error leyendo caché:",
            error
        );

        return {};

    }

}


/* =====================================================
   GUARDAR CACHÉ
===================================================== */

function guardarCache(cache){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify(cache)
        );

    }catch(error){

        console.log(
            "❌ Error guardando caché:",
            error
        );

    }

}


/* =====================================================
   APLICAR DATOS DE TMDB
===================================================== */

function aplicarDatosTMDB(tarjeta, datos){

    if(!datos) return;


    /*
       Nombre manual.

       Si data-nombre existe, tendrá prioridad
       sobre el nombre de TMDB.
    */

    const tituloManual =
        tarjeta.dataset.nombre?.trim();


    const titulo =
        tituloManual ||
        datos.title ||
        datos.name ||
        "Sin título";


    /*
       Título mostrado.
    */

    const tituloMostrar =
        titulo.length > 30
            ? titulo.substring(0,30).trim() + "..."
            : titulo;


    const tituloElemento =
        tarjeta.querySelector(".titulo-serie");


    if(tituloElemento){

        tituloElemento.textContent =
            tituloMostrar;

    }


    /*
       Poster.
    */

    const img =
        tarjeta.querySelector("img");


    if(!img) return;


    /*
       Poster manual si existe.
    */

    const posterManual =
        tarjeta.dataset.poster?.trim();


    /*
       Poster de TMDB.
    */

    const posterTMDB =
        datos.poster_path
            ? IMG + datos.poster_path
            : "";


    const urlImagen =
        posterManual || posterTMDB;


    if(!urlImagen) return;


    /*
       Guardamos la URL en data-src.
    */

    img.dataset.src =
        urlImagen;


    img.alt = titulo;


    /*
       Las primeras 20 imágenes se cargan
       inmediatamente.

       Las demás utilizan Lazy Loading.
    */

    const numero =
        Number(tarjeta.dataset.numero);


    if(numero <= PORTADAS_INICIALES){

        cargarImagenInmediata(img);

    }else{

        cargarImagenLazy(img);

    }

}


/* =====================================================
   CARGAR IMAGEN INMEDIATAMENTE
===================================================== */

function cargarImagenInmediata(img){

    if(!img) return;


    if(img.dataset.src){

        img.src =
            img.dataset.src;

        delete img.dataset.src;

    }

}


/* =====================================================
   LAZY LOADING
===================================================== */

function cargarImagenLazy(img){

    if(!img) return;


    /*
       Si el navegador/WebView soporta
       IntersectionObserver.
    */

    if("IntersectionObserver" in window){

        const observer =
            new IntersectionObserver(
                entries => {

                    entries.forEach(entry => {

                        if(!entry.isIntersecting)
                            return;


                        const imagen =
                            entry.target;


                        if(imagen.dataset.src){

                            imagen.src =
                                imagen.dataset.src;

                            delete imagen.dataset.src;

                        }


                        observer.unobserve(imagen);

                    });

                },
                {
                    /*
                       Comienza a cargar la portada
                       unos 300px antes de que aparezca.
                    */
                    rootMargin:"300px"
                }
            );


        observer.observe(img);


    }else{

        /*
           Compatibilidad con WebView antiguos.
        */

        cargarImagenInmediata(img);

    }

}


/* =====================================================
   CARGAR TMDB
===================================================== */

async function cargarPeliculas(){

    const tarjetas =
        Array.from(
            document.querySelectorAll(".serie")
        );


    /*
       Asignar número a cada tarjeta.

       Esto permite determinar cuáles son
       las primeras 20.
    */

    tarjetas.forEach(
        (tarjeta, indice) => {

            tarjeta.dataset.numero =
                indice + 1;

        }
    );


    const cache =
        obtenerCache();


    const nuevasPeticiones = [];


    /*
       Revisamos cada serie.
    */

    tarjetas.forEach(tarjeta => {

        const id =
            tarjeta.dataset.id;


        const tipo =
            tarjeta.dataset.tipo;


        if(!id || !tipo)
            return;


        const cacheId =
            `${tipo}_${id}`;


        const almacenado =
            cache[cacheId];


        /*
          =================================================
          CACHÉ VÁLIDA
          =================================================
        */

        if(
            almacenado &&
            almacenado.timestamp &&
            (
                Date.now() -
                almacenado.timestamp
            ) < CACHE_DURATION
        ){

            /*
               Aplicamos los datos inmediatamente.

               NO hacemos petición a TMDB.
            */

            aplicarDatosTMDB(
                tarjeta,
                almacenado.data
            );


            return;

        }


        /*
          =================================================
          SERIE NUEVA
          =================================================
        */

        nuevasPeticiones.push({

            tarjeta,
            id,
            tipo,
            cacheId

        });

    });


    /*
       Si no existen series nuevas,
       terminamos aquí.

       Esto hace que la segunda visita
       sea muchísimo más rápida.
    */

    if(nuevasPeticiones.length === 0){

        console.log(
            "✅ Todas las series fueron cargadas desde caché"
        );

        return;

    }


    console.log(
        `🔄 ${nuevasPeticiones.length} series nuevas`
    );


    /*
       Número de peticiones simultáneas.
    */

    const TAMANO_GRUPO = 8;


    /*
       Procesamos las nuevas series
       en grupos.
    */

    for(
        let i = 0;
        i < nuevasPeticiones.length;
        i += TAMANO_GRUPO
    ){

        const grupo =
            nuevasPeticiones.slice(
                i,
                i + TAMANO_GRUPO
            );


        await Promise.all(

            grupo.map(
                async item => {

                    const {
                        tarjeta,
                        id,
                        tipo,
                        cacheId
                    } = item;


                    const url =
                        `${TMDB}/${tipo}/${id}?api_key=${API_KEY}&language=es-ES`;


                    try{

                        const respuesta =
                            await fetch(url);


                        if(!respuesta.ok){

                            throw new Error(
                                `TMDB HTTP ${respuesta.status}`
                            );

                        }


                        const datos =
                            await respuesta.json();


                        /*
                           Guardar en caché.
                        */

                        cache[cacheId] = {

                            timestamp:
                                Date.now(),

                            data:
                                datos

                        };


                        /*
                           Mostrar inmediatamente
                           los datos obtenidos.
                        */

                        aplicarDatosTMDB(
                            tarjeta,
                            datos
                        );


                    }catch(error){

                        console.log(
                            `❌ Error TMDB ${id}:`,
                            error
                        );

                    }

                }
            )

        );


        /*
           Guardar después de cada grupo.

           Así no perdemos todo si el usuario
           cierra la aplicación.
        */

        guardarCache(cache);

    }


    console.log(
        "✅ Carga TMDB finalizada"
    );

}


/* =====================================================
   INICIO
===================================================== */

(async()=>{

    /*
       Mostramos loader.
    */

    loading.classList.remove("hide");


    /*
       Cargamos TMDB o caché.
    */

    await cargarPeliculas();


    /*
       Ya tenemos los títulos y las URLs
       de las imágenes.

       No necesitamos esperar a que todas
       las portadas terminen de descargar.
    */

    hideLoading();

})();

</script>
<script>
  const modal = document.getElementById("connectionModal");
  const toast = document.getElementById("toast");
  let wasOffline = false;

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
  }

  function updateConnectionStatus() {
    if (!navigator.onLine) {
      modal.classList.add("active");
      wasOffline = true;
    } else {
      modal.classList.remove("active");
      if (wasOffline) {
        showToast("✅ ¡Conexión restaurada!");
        wasOffline = false;
      }
    }
  }

  window.addEventListener("load", updateConnectionStatus);
  window.addEventListener("offline", updateConnectionStatus);
  window.addEventListener("online", updateConnectionStatus);
</script>

  document.addEventListener("selectstart", function(event) {
    event.preventDefault();

</script>
